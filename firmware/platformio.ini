; SafeRoute Micro Pod firmware (fixed-angle mode) - board: ESP32 DevKit V1 (DOIT, ESP32-WROOM-32, 30 pins)
; Parts: VL53L5CX x2 + Grove 3-axis accelerometer (no gyro) + 2 ELEGOO DC motors on PN2222 +
; on-board LED, USB power bank. The sweep position comes from the accelerometer; head-level
; maths use the fixed trained cane angle (include/config.h section 5).
;
;   pio run -e esp32dev -t upload       THE pod
;   pio run -e haptic_test_pwm -t upload   motor bench test (ELEGOO motors on GPIO18 / GPIO19)
;   pio test -e native                  unit tests on the laptop (needs gcc)
;   pio device monitor                  serial telemetry + commands (type 'help')
;
; Uploading to the DevKit V1: if it stops at "Connecting....", hold BOOT until the dots move.

[platformio]
default_envs = esp32dev

[env]
; VL53L5CX: read only the result fields the pod uses (distance, status, target count): ~3x fewer
; I2C bytes per frame. Must be global: the SparkFun library is compiled with these flags too.
build_flags = -I include
    -D VL53L5CX_DISABLE_AMBIENT_PER_SPAD -D VL53L5CX_DISABLE_NB_SPADS_ENABLED
    -D VL53L5CX_DISABLE_SIGNAL_PER_SPAD -D VL53L5CX_DISABLE_RANGE_SIGMA_MM
    -D VL53L5CX_DISABLE_REFLECTANCE_PERCENT -D VL53L5CX_DISABLE_MOTION_INDICATOR
lib_ldf_mode = deep+

[esp32_base]
; pinned: builds the same on a clean laptop. 8.0.0 = Arduino core 3.3
platform = espressif32@8.0.0
framework = arduino
; deep (not deep+): deep+ cannot evaluate sdkconfig.h, so it misses BLE -> Preferences
lib_ldf_mode = deep
; BLE (Bluedroid) on core 3.3 makes the image ~1.34 MB: too big for the default 1.25 MB
; app slot on a 4 MB ESP32. 3 MB app, no OTA (the pod is flashed over USB).
board_build.partitions = huge_app.csv
monitor_speed = 460800
upload_speed = 921600
lib_deps =
    sparkfun/SparkFun VL53L5CX Arduino Library@^1.0.3
build_src_filter = +<*> -<haptic_test/>

; THE pod: VL53L5CX x2 (LPn on GPIO17 ground / GPIO16 forward), Grove 3-axis accelerometer,
; ELEGOO DC motors on GPIO18/19 via PN2222, on-board LED, power bank.
[env:esp32dev]
extends = esp32_base
board = esp32doit-devkit-v1

; Motor bench test: buzzes the ELEGOO motors through the same driver (wiring bring-up).
[env:haptic_test_pwm]
extends = esp32_base
board = esp32doit-devkit-v1
build_src_filter = +<hal/> +<haptic_test/>

[env:native]
platform = native
build_flags = ${env.build_flags} -std=gnu++11
test_build_src = no
